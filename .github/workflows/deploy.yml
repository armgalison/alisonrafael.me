name: Build and deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: alisonrafael.me-web
            context: ./web-client
            dockerfile: ./web-client/Dockerfile
          - image: alisonrafael.me-api
            context: .
            dockerfile: ./server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # Writes .env from repo secrets on every deploy, so the real
          # values live only in GitHub's encrypted secret store — never
          # typed by hand on the droplet, never in git.
          script: |
            cd ${{ secrets.DROPLET_APP_DIR }}
            cat > .env <<'ENVEOF'
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            DB_USER=alisonrafael
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=alisonrafael
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN_SECONDS=86400
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            ENVEOF
            chmod 600 .env
            docker compose pull
            docker compose up -d
            docker image prune -f
