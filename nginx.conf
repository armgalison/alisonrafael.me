server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache';
    }

    # Vite content-hashes these filenames, so a new deploy is always a new
    # URL — safe to cache forever.
    location /assets/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location = /resume.pdf {
        add_header Content-Disposition 'attachment; filename="Alison-Goncalves-Resume.pdf"';
        add_header Cache-Control 'public, max-age=86400';
    }

    location ~* ^/(favicon\.ico|favicon-\d+x\d+\.png|apple-touch-icon\.png|android-chrome-\d+x\d+\.png|site\.webmanifest)$ {
        add_header Cache-Control 'public, max-age=86400';
    }

    location = /avatar.png {
        add_header Cache-Control 'public, max-age=86400';
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
