services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.11
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      # Per-vhost timeout override for api.alisonrafael.me — see ADR 0007.
      # A file bind-mounted here takes precedence over the named volume's
      # copy at the same path.
      - ./vhost.d/api.alisonrafael.me:/etc/nginx/vhost.d/api.alisonrafael.me:ro
    networks:
      - nginx-proxy

  acme-companion:
    image: nginxproxy/acme-companion:2.8
    container_name: nginx-proxy-acme
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    name: nginx-proxy

volumes:
  certs:
  vhost:
  html:
  acme:
